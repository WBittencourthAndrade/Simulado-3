<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Especialista FCC — Nível Médio (Versão HTML Permanente)</title>
<meta name="description" content="Especialista FCC: Raio-X de incidência, questões inéditas com gabarito comentado, importação de cadernos em PDF e simulado interativo. Versão HTML permanente offline.">

<!-- ===== Tela cheia / App Web (PWA) — iOS e Android ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Especialista FCC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Especialista FCC">
<meta name="theme-color" content="#020617">
<meta name="format-detection" content="telephone=no">
<!-- Manifest real (display: standalone) — arquivo /manifest.json -->
<link rel="manifest" href="/manifest.json">
<!-- Ícones PNG reais (o iOS não aceita SVG/data-URI em apple-touch-icon) -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

<style>
:root {
  --fcc-fs: 16px;
  --fcc-ff: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: #f4f6fb;
  color: #0b1220;
  font-family: var(--fcc-ff);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
/* Em modo App instalado (tela cheia), respeita o topo do aparelho (notch / status bar translúcida) */
@media (display-mode: standalone), (display-mode: fullscreen) {
  .app-header { padding-top: env(safe-area-inset-top); }
  body { overscroll-behavior: none; }
}
/* Reforço para iOS (navigator.standalone): a classe é aplicada via JS no boot */
html.is-standalone .app-header { padding-top: env(safe-area-inset-top); }
html.is-standalone body { overscroll-behavior: none; }
.fcc-text {
  font-family: var(--fcc-ff);
  font-size: var(--fcc-fs);
  line-height: 1.7;
  text-align: justify;
  -webkit-hyphens: auto;
  hyphens: auto;
  letter-spacing: -0.005em;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
a { color: inherit; }

/* ---------- Header ---------- */
.app-header { position: sticky; top: 0; z-index: 40; background: #020617; color: #fff; box-shadow: 0 10px 30px rgba(2,6,23,.18); }
.gold-line { height: 3px; background: linear-gradient(90deg,#c9a227 0%,#e9c659 25%,#c9a227 50%,#8a6d1b 100%); }
.header-inner { max-width: 72rem; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.brand-logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg,#2563eb,#4338ca); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(37,99,235,.35); font-size: 18px; }
.brand-title { font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
.brand-title span { color: #e9c659; font-weight: 900; }
.brand-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
.header-actions { display: flex; align-items: center; gap: 8px; }

/* Font control */
.font-ctrl { display: flex; align-items: center; gap: 2px; border: 1px solid #1e293b; border-radius: 12px; padding: 2px; background: rgba(15,23,42,.6); }
.font-ctrl button { width: 32px; height: 32px; border: 0; background: none; color: #cbd5e1; border-radius: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.font-ctrl button:hover { background: rgba(255,255,255,.08); color: #fff; }
.font-ctrl .size-label { min-width: 40px; text-align: center; font-size: 11px; font-weight: 800; color: #e2e8f0; font-variant-numeric: tabular-nums; }
.font-ctrl .divider { width: 1px; height: 18px; background: #334155; margin: 0 3px; }

.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid #1e293b; background: none; color: #cbd5e1; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
.icon-btn .dot { position: absolute; width: 10px; height: 10px; border-radius: 99px; border: 2px solid #020617; background: #34d399; margin: -22px -22px 0 0; }

.status-strip { background: rgba(15,23,42,.85); border-top: 1px solid rgba(30,41,59,.6); font-size: 11px; color: #94a3b8; display: none; }
.status-strip .inner { max-width: 72rem; margin: 0 auto; padding: 6px 16px; display: flex; gap: 8px; align-items: center; }
.pulse { width: 7px; height: 7px; border-radius: 99px; background: #34d399; animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ---------- Layout ---------- */
main { max-width: 72rem; margin: 0 auto; padding: 16px 12px 120px; }
.section-gap > * + * { margin-top: 24px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 12px 30px rgba(148,163,184,.12); }
.hero { position: relative; overflow: hidden; border-radius: 28px; background: #020617; color: #fff; padding: 22px 18px; border: 1px solid #1e293b; box-shadow: 0 24px 50px rgba(2,6,23,.28); }
.hero:before { content: ""; position: absolute; inset: 0; background: radial-gradient(700px 260px at 85% -10%, rgba(37,99,235,.28), transparent 60%), radial-gradient(500px 240px at 0% 120%, rgba(201,162,39,.14), transparent 60%); }
.hero > * { position: relative; }
.pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 800; background: rgba(255,255,255,.06); border: 1px solid rgba(233,198,89,.32); color: #fde68a; }
h1 { font-size: 26px; line-height: 1.15; font-weight: 900; letter-spacing: -.03em; margin: 12px 0 8px; }
h1 .gold { color: #e9c659; }
.hero p { color: #94a3b8; font-size: 13px; margin: 0; }
.cmd-box { margin-top: 16px; background: rgba(30,41,59,.75); border: 1px solid rgba(59,130,246,.38); border-radius: 18px; padding: 14px 16px; font-size: 12px; color: #e2e8f0; line-height: 1.7; }
.cmd-box .lbl { color: #60a5fa; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; display: block; margin-bottom: 4px; }
.cmd-box code { color: #fcd34d; font-family: ui-monospace, monospace; font-size: 11px; }

label.field-label { display: block; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; color: #334155; margin-bottom: 6px; }
input[type=text], select { width: 100%; padding: 13px 15px; border-radius: 16px; border: 2px solid #e2e8f0; background: #f8fafc; color: #0f172a; font-size: 14px; font-weight: 600; outline: none; }
input[type=text]:focus, select:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
input[type=password] { width: 100%; padding: 11px 14px; border-radius: 13px; border: 1.5px solid #e2e8f0; background: #fff; font-family: ui-monospace, monospace; font-size: 12px; outline: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 17px; font-weight: 900; font-size: 13px; padding: 13px 20px; transition: .15s; }
.btn:active { transform: scale(.985); }
.btn-primary { color: #fff; background: linear-gradient(135deg,#1d4ed8,#4338ca); box-shadow: 0 16px 34px rgba(37,99,235,.28); }
.btn-primary:hover { filter: brightness(1.07); }
.btn-success { color: #fff; background: linear-gradient(135deg,#047857,#059669); box-shadow: 0 14px 30px rgba(5,150,105,.28); }
.btn-ghost { background: #fff; border: 1.5px solid #e2e8f0; color: #334155; }
.btn-ghost:hover { background: #f8fafc; }
.btn-dark { background: #0f172a; color: #fff; }
.btn-sm { padding: 9px 14px; font-size: 11px; border-radius: 13px; }
.btn-full { width: 100%; }

.q-btn-group { display: inline-flex; gap: 4px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 14px; padding: 4px; }
.q-btn-group button { border: 0; background: none; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 800; color: #64748b; }
.q-btn-group button.active { background: #fff; color: #1d4ed8; box-shadow: 0 2px 8px rgba(15,23,42,.1); }

/* ---------- Stage panels ---------- */
.stage-head { padding: 18px 20px; color: #fff; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-radius: 24px 24px 0 0; }
.stage-1 { background: linear-gradient(120deg,#0f172a,#1e3a8a 70%,#312e81); }
.stage-3-head { background: linear-gradient(120deg,#064e3b,#059669 80%); }
.stage-num { width: 32px; height: 32px; border-radius: 11px; background: rgba(233,198,89,.22); border: 1px solid rgba(233,198,89,.45); color: #fde68a; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.stage-title { font-size: 16px; font-weight: 900; letter-spacing: -.02em; }
.stage-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; font-weight: 800; color: #93c5fd; }
.badge { font-size: 10px; font-weight: 900; padding: 5px 11px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
.badge-red { background: rgba(244,63,94,.18); color: #fecdd3; border: 1px solid rgba(244,63,94,.4); }
.badge-amber { background: rgba(245,158,11,.18); color: #fde68a; border: 1px solid rgba(245,158,11,.4); }
.badge-blue { background: rgba(59,130,246,.2); color: #bfdbfe; border: 1px solid rgba(59,130,246,.4); }
.badge-green { background: #059669; color: #fff; }
.badge-grey { background: #e2e8f0; color: #334155; }
.badge-purple { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }

.grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 780px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3,1fr); }
}
.panel { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 18px; padding: 16px; }
.panel h4 { margin: 0 0 10px; font-size: 13px; font-weight: 900; display: flex; gap: 8px; align-items: center; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li { font-size: 12px; color: #334155; margin-bottom: 5px; }

.trap-card { background: rgba(254,243,199,.7); border: 1px solid #fde68a; border-radius: 18px; padding: 14px; }
.trap-card .t { font-size: 12px; font-weight: 900; color: #78350f; display: flex; gap: 7px; align-items: flex-start; }
.trap-card .d { font-size: 11.5px; color: #92400e; line-height: 1.65; text-align: justify; margin-top: 6px; }
.trap-card .ex { font-size: 11px; background: rgba(255,255,255,.85); border: 1px solid #fde68a; padding: 8px; border-radius: 11px; margin-top: 8px; font-family: ui-monospace, monospace; color: #78350f; }

.tip-card { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 18px; padding: 15px; font-size: 12.5px; color: #064e3b; }
.tip-card strong { display: block; margin-bottom: 3px; color: #065f46; }

/* ---------- Questions ---------- */
.q-card { overflow: hidden; }
.q-head { background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 13px 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.q-num { font-size: 11px; font-weight: 900; background: #0f172a; color: #fff; padding: 5px 11px; border-radius: 9px; }
.q-disc { font-size: 11px; font-weight: 800; color: #475569; }
.opt { display: flex; gap: 11px; align-items: flex-start; padding: 14px 15px; border: 1.5px solid #e2e8f0; border-radius: 16px; background: #fff; font-size: 14px; transition: .12s; position: relative; }
.opt:hover { background: #f8fafc; }
.opt .letter { width: 28px; height: 28px; border-radius: 999px; background: #f1f5f9; color: #475569; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; flex-shrink: 0; }
.opt .txt { flex: 1; line-height: 1.65; }
.opt.eliminated { text-decoration: line-through; opacity: .5; filter: grayscale(.7); }
.opt.correct { border-color: #10b981; background: rgba(236,253,245,.85); color: #064e3b; font-weight: 500; box-shadow: 0 0 0 1px #10b981; }
.opt.correct .letter { background: #059669; color: #fff; }
.opt.wrong { border-color: #f43f5e; background: rgba(255,241,242,.85); color: #881337; font-weight: 500; box-shadow: 0 0 0 1px #f43f5e; }
.opt.wrong .letter { background: #e11d48; color: #fff; }
.opt.dim { background: #f8fafc; color: #94a3b8; }
.opt.dim .letter { background: #e2e8f0; color: #64748b; }
.opt-stack > * + * { margin-top: 10px; }

.strike-btn { border: 0; background: none; color: #94a3b8; padding: 5px; border-radius: 8px; flex-shrink: 0; }
.strike-btn:hover { background: #e2e8f0; color: #475569; }

.feedback-line { font-size: 11.5px; color: #64748b; }
.feedback-line.ok { color: #047857; font-weight: 900; }
.feedback-line.no { color: #be123c; font-weight: 900; }

.found-box { background: #fff; border: 1px solid #a7f3d0; border-left: 4px solid #059669; border-radius: 14px; padding: 13px 15px; }
.found-box .k { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: #065f46; }
.found-box .v { font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: #0f172a; line-height: 1.75; text-align: justify; white-space: pre-line; margin-top: 6px; }
.found-dev { display: inline-block; background: #047857; color: #fff; font-size: 11px; font-weight: 900; padding: 5px 11px; border-radius: 9px; margin-bottom: 8px; }
.mem-card { background: #fffbeb; border: 1px solid #fde68a; border-radius: 13px; padding: 11px 13px; font-size: 12px; color: #78350f; line-height: 1.7; text-align: justify; }

.dist-item { padding: 12px 14px; border-radius: 13px; border: 1px solid #e2e8f0; background: #fff; font-size: 12px; line-height: 1.72; text-align: justify; }
.dist-item.ok { background: #ecfdf5; border-color: #a7f3d0; color: #064e3b; }
.dist-item .lb { font-weight: 900; padding: 2px 8px; border-radius: 6px; font-size: 10.5px; margin-right: 6px; background: #e2e8f0; color: #334155; }
.dist-item.ok .lb { background: #059669; color: #fff; }

/* ---------- Simulado ---------- */
.sim-bar { background: #020617; color: #fff; border: 1px solid #1e293b; border-radius: 24px; padding: 15px 17px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 22px 44px rgba(2,6,23,.25); }
.timer-box { display: flex; align-items: center; gap: 9px; background: #0f172a; border: 1px solid #1e293b; padding: 8px 13px; border-radius: 16px; }
.timer-val { font-family: ui-monospace, monospace; font-size: 19px; font-weight: 900; letter-spacing: .04em; }
.timer-btn { border: 0; background: rgba(255,255,255,.07); color: #fbbf24; width: 29px; height: 29px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.bubbles { display: flex; flex-wrap: wrap; gap: 6px; }
.bubble { width: 33px; height: 33px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; position: relative; }
.bubble.answered { background: #dbeafe; color: #1e3a8a; border-color: #93c5fd; }
.bubble.current { background: #2563eb; color: #fff; border-color: #1d4ed8; box-shadow: 0 0 0 2px #93c5fd; }
.bubble.ok { background: #059669; color: #fff; border-color: #047857; }
.bubble.no { background: #e11d48; color: #fff; border-color: #be123c; }
.bubble .flag { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 99px; background: #fbbf24; }

.pause-panel { background: #0f172a; color: #fff; border: 2px solid #fbbf24; border-radius: 24px; padding: 22px 20px; }
.pause-panel h3 { margin: 6px 0 0; font-size: 21px; font-weight: 900; }
.pause-panel p { color: #cbd5e1; font-size: 12.5px; line-height: 1.75; text-align: justify; }
.pause-panel .lbl { color: #fcd34d; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; }

.summary-card { background: #020617; color: #fff; border: 1px solid #1e293b; border-radius: 24px; padding: 20px 18px; }
.summary-card .pct { font-size: 31px; font-weight: 900; color: #34d399; }
.kpi { background: rgba(15,23,42,.8); border: 1px solid #1e293b; border-radius: 14px; padding: 11px 13px; }
.kpi .k { font-size: 9.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .11em; color: #64748b; display: block; }
.kpi .v { font-family: ui-monospace, monospace; font-size: 16px; font-weight: 900; color: #fff; }

/* ---------- History / Errors / Stats ---------- */
.hist-card { padding: 0; overflow: hidden; }
.hist-main { padding: 16px; display: flex; flex-direction: column; gap: 13px; cursor: pointer; }
@media (min-width: 860px) {
  .hist-main { flex-direction: row; align-items: center; justify-content: space-between; }
}
.hist-main:hover { background: #f8fafc; }
.hist-title { font-size: 15.5px; font-weight: 900; color: #0f172a; line-height: 1.35; }
.hist-meta { font-size: 11px; color: #64748b; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 4px; }
.tag { font-size: 9.5px; font-weight: 900; padding: 3px 9px; border-radius: 7px; letter-spacing: .03em; }
.tag-pdf { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }
.tag-ia { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
.tag-done { background: #d1fae5; color: #047857; border: 1px solid #a7f3d0; }
.tag-progress { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
.hist-actions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.hist-detail { border-top: 1px solid #e2e8f0; background: #f8fafc; padding: 16px; }

.bar-row { margin-bottom: 14px; }
.bar-row .top { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: #334155; margin-bottom: 5px; }
.bar-track { height: 11px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .5s; }

.stat-tile { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 18px; box-shadow: 0 10px 26px rgba(148,163,184,.1); }
.stat-tile .k { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .11em; color: #64748b; }
.stat-tile .v { font-size: 31px; font-weight: 900; letter-spacing: -.03em; margin: 6px 0 3px; }

/* ---------- Upload ---------- */
.drop-zone { border: 2px dashed #cbd5e1; border-radius: 26px; padding: 34px 18px; text-align: center; background: rgba(248,250,252,.6); transition: .15s; cursor: pointer; }
.drop-zone:hover, .drop-zone.over { border-color: #2563eb; background: rgba(239,246,255,.65); }
.drop-icon { width: 64px; height: 64px; border-radius: 20px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; margin: 0 auto; }

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid #e2e8f0; box-shadow: 0 -8px 30px rgba(15,23,42,.08); }
.bottom-nav .inner { display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); }
.nav-btn { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 10px; min-width: 62px; color: #64748b; border-radius: 12px; }
.nav-btn.active { color: #1d4ed8; }
.nav-btn .ic { padding: 5px; border-radius: 9px; font-size: 18px; line-height: 1; }
.nav-btn.active .ic { background: #eff6ff; }
.nav-btn .lb { font-size: 9.5px; font-weight: 800; }

/* ---------- Modals / Toast ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(2,6,23,.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 14px; }
.modal { background: #fff; border-radius: 24px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid #e2e8f0; box-shadow: 0 30px 70px rgba(2,6,23,.4); animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
.modal-head { background: #020617; color: #fff; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 18px; }
.modal-foot { background: #f8fafc; padding: 13px 18px; display: flex; gap: 9px; justify-content: flex-end; border-top: 1px solid #e2e8f0; }
.toast { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 12.5px; font-weight: 700; z-index: 80; box-shadow: 0 18px 40px rgba(2,6,23,.35); animation: pop .2s; max-width: 92vw; }

<script>
/* =====================================================================
   ESPECIALISTA FCC — VERSÃO HTML PERMANENTE (arquivo único, offline)
   Dados: localStorage | IA: Gemini API direto no navegador | PDF: pdf.js
   ===================================================================== */

const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* Chave padrão do usuário (pode ser substituída em ⚙️ Ajustes).
   Fica embutida neste arquivo — recomendado restringir por domínio no Google AI Studio. */
const DEFAULT_API_KEY = "AQ.Ab8RN6IepmaG73Akksh3LBiuGaq09LCIyo_oF8zzC5y8WENySg";

const NAV = [
  { id: 'generator', label: 'Gerador', short: 'Gerar', ic: '✨' },
  { id: 'pdf', label: 'Importar PDF', short: 'PDF', ic: '📄' },
  { id: 'erros', label: 'Caderno de Erros', short: 'Erros', ic: '⚠️' },
  { id: 'stats', label: 'Desempenho', short: 'Desempenho', ic: '📊' },
  { id: 'history', label: 'Histórico', short: 'Histórico', ic: '🗂️' }
];

let state = {
  tab: 'generator',
  sessions: LS.get('fcc_sessions_v1', []),
  settings: LS.get('fcc_settings_v1', { apiKey: '', model: 'gemini-3.5-flash-lite', fontSize: 16, fontFamily: 'sans' }),
  gen: null,           // resultado da geração (raio-x + questões)

  histExpanded: {},
  importing: false,
  importMsg: '',
  expandedError: {}
};

const LETTERS = ['A', 'B', 'C', 'D', 'E'];

function saveSessions() { LS.set('fcc_sessions_v1', state.sessions); }
function saveSettings() { LS.set('fcc_settings_v1', state.settings); applyFont(); }
function uid() { return Date.now() + Math.floor(Math.random() * 10000); }

/* ---------------- Font controls ---------------- */
function applyFont() {
  document.documentElement.style.setProperty('--fcc-fs', state.settings.fontSize + 'px');
  document.documentElement.style.setProperty('--fcc-ff',
    state.settings.fontFamily === 'serif'
      ? 'Georgia, Cambria, "Times New Roman", serif'
      : 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif');
  const lbl = document.getElementById('fontSizeLabel');
  if (lbl) lbl.textContent = state.settings.fontSize + 'px';
}
function setFont(delta) {
  state.settings.fontSize = Math.min(21, Math.max(13, state.settings.fontSize + delta));
  saveSettings();
}
function toggleFamily() {
  state.settings.fontFamily = state.settings.fontFamily === 'serif' ? 'sans' : 'serif';
  saveSettings();
  toast(state.settings.fontFamily === 'serif' ? 'Fonte alterada para serifada (estilo livro de lei)' : 'Fonte alterada para sem serifa');
}

/* ---------------- Toast ---------------- */
function toast(msg, ms = 2600) {
  const root = document.getElementById('toastRoot');
  root.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  setTimeout(() => { root.innerHTML = ''; }, ms);
}

/* ---------------- Utils ---------------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = t % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function fmtDate(d) {
  try { return new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

/* ---------------- Navigation ---------------- */
function go(tab) {
  state.tab = tab;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderNav() {
  document.getElementById('navInner').innerHTML = NAV.map(n => `
    <button class="nav-btn ${state.tab === n.id || (state.tab === 'simulado' && n.id === 'pdf') ? 'active' : ''}" onclick="go('${n.id}')">
      <span class="ic">${n.ic}</span><span class="lb">${n.short}</span>
    </button>`).join('') + `
    <button class="nav-btn" onclick="openSettings()">
      <span class="ic">⚙️</span><span class="lb">Ajustes</span>
    </button>`;
}

function renderStatus() {
  const strip = document.getElementById('statusStrip');
  const a = allAnswers();
  if (a.length === 0) { strip.style.display = 'none'; return; }
  strip.style.display = 'block';
  const ok = a.filter(x => x.isCorrect).length;
  document.getElementById('statusText').innerHTML =
    '<strong style="color:#e2e8f0">' + a.length + '</strong> questões resolvidas • Taxa de acerto: ' +
    '<strong style="color:#34d399">' + Math.round(ok / a.length * 100) + '%</strong> • Padrão FCC Nível Médio';
}

/* ---------------- Data helpers ---------------- */
function allAnswers() {
  const out = [];
  state.sessions.forEach(s => (s.answers || []).forEach(a => {
    const q = (s.questions || []).find(x => x.id === a.qid);
    if (q) out.push({ ...a, question: q, session: s });
  }));
  return out;
}
function sessionAnswers(s) { return (s.answers || []).filter(a => (s.questions || []).some(q => q.id === a.qid)); }
function sessionStats(s) {
  const ans = sessionAnswers(s);
  const total = (s.questions || []).length;
  const correct = ans.filter(a => a.isCorrect).length;
  return { total, answered: ans.length, correct, accuracy: ans.length ? Math.round(correct / ans.length * 100) : 0, done: total > 0 && ans.length >= total };
}

/* =====================================================================
   IA — GEMINI (direto do navegador)
   ===================================================================== */
const SYSTEM_PROMPT = `Você é o Especialista Sênior em Bancas de Concursos Públicos, com foco exclusivo na Fundação Carlos Chagas (FCC) para Nível Médio (Técnico Judiciário de TRTs, TREs, TRFs, TJs e Administrativos).

Fluxo obrigatório em 3 etapas:
ETAPA 1 — RAIO-X FCC: frequência (Alta/Média/Baixa nos últimos 3 a 5 anos), padrão típico de cobrança (formato e artigos/regras mais visados), mapeamento de pegadinhas comuns e uma dica de ouro.
ETAPA 2 — QUESTÕES INÉDITAS: nível médio rigoroso, 5 alternativas (A–E) balanceadas, tom sóbrio e formal da FCC ("Considere que...", "Segundo a disciplina legal..."), distratores verossímeis (nunca absurdos).
ETAPA 3 — GABARITO COMENTADO: fundamento direto (dispositivo + transcrição literal, ou "Regra:" em Português/Raciocínio Lógico) e explicação alternativa por alternativa dizendo O MOTIVO do erro.

É PROIBIDO inventar número de artigo, inciso, súmula ou texto de lei. Se não tiver certeza da redação literal, use "Regra:" em vez de fingir transcrição.
Distribua o gabarito entre A, B, C, D e E. Cada questão trata de um ponto DIFERENTE do tema.
Responda estritamente em JSON válido, sem markdown.`;

function buildGenPrompt(theme, discipline, exam, count) {
  return `Tema: "${theme}"
Disciplina: "${discipline}"
Concurso/Órgão alvo: "${exam}"
Quantidade de questões inéditas: ${count}

Todas as ${count} questões devem ser ESTRITAMENTE sobre o tema informado, cada uma abordando um ponto distinto.

Retorne estritamente JSON (sem markdown):
{
  "rayX": {
    "frequency": "Alta" | "Média" | "Baixa",
    "typicalPattern": { "formatPreference": "...", "targetArticles": ["..."], "styleSummary": "..." },
    "trapMapping": [ { "trapName": "...", "description": "...", "example": "..." } ],
    "seniorTip": "..."
  },
  "questions": [
    {
      "statement": "Enunciado completo...",
      "options": { "A": "...", "B": "...", "C": "...", "D": "...", "E": "..." },
      "correctOption": "A",
      "discipline": "...",
      "fccTrapType": "tipo de pegadinha",
      "foundation": {
        "dispositivo": "Art. X, § Y, da Lei nº Z/AAAA (ou nome da regra)",
        "fonte": "Lei nº Z/AAAA (ou Gramática normativa / Lógica proposicional)",
        "transcricao": "Transcrição literal do trecho que sustenta o gabarito (use (... ) para omissões). Nunca invente textos legais.",
        "explicacao": "Aplicação do texto ao caso do enunciado e à alternativa correta.",
        "dicaMemorizacao": "Macete curto."
      },
      "distractorAnalysis": {
        "A": "CORRETA/INCORRETA. O erro está em «trecho»; o correto seria «termo» (dispositivo).",
        "B": "...", "C": "...", "D": "...", "E": "..."
      }
    }
  ]
}`;
}

function buildParsePrompt(chunk, startNumber) {
  return `Você é especialista em cadernos de provas de concursos (FCC, nível médio).
O TEXTO abaixo é um trecho de um caderno em PDF. Extraia TODAS as questões objetivas com 5 alternativas (A–E).

Regras:
1. "statement": enunciado completo sem as alternativas.
2. "options": texto de cada alternativa SEM a letra.
3. "correctOption": use estritamente o gabarito do documento (mesmo que esteja em seção final "GABARITO OFICIAL"); sem gabarito, resolva com precisão técnica.
4. "foundation": dispositivo, fonte, transcricao, explicacao e dicaMemorizacao que validam o gabarito.
5. "distractorAnalysis": para cada alternativa, o motivo do acerto (correta) ou o motivo EXATO do erro (incorretas).
6. "discipline": a matéria. "fccTrapType": tipo de pegadinha.
Início da numeração: ${startNumber}.

TEXTO:
"""
${chunk}
"""

Retorne estritamente JSON:
{
  "title": "Título do caderno/concurso ou ''",
  "questions": [ { "orderIndex": ${startNumber}, "statement": "...", "options": {"A":"...","B":"...","C":"...","D":"...","E":"..."}, "correctOption": "A", "discipline": "...", "fccTrapType": "...",
    "foundation": { "dispositivo": "...", "fonte": "...", "transcricao": "...", "explicacao": "...", "dicaMemorizacao": "..." },
    "distractorAnalysis": { "A": "...", "B": "...", "C": "...", "D": "...", "E": "..." } } ]
}`;
}

function stripFences(t) {
  return String(t || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
}
function normLetter(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).toUpperCase().trim();
  const m = s.match(/[A-E]/);
  return m ? m[0] : null;
}

async function callGemini(prompt, systemPrompt) {
  const key = (state.settings.apiKey || '').trim();
  if (!key) throw new Error('Chave da API Gemini não configurada. Abra "Ajustes" e cole sua chave.');
  const models = [...new Set([state.settings.model || 'gemini-3.5-flash-lite', 'gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.8-flash'])];
  let lastErr = '';
  for (const model of models) {
    try {
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: systemPrompt || SYSTEM_PROMPT }] },
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.3, maxOutputTokens: 32768, responseMimeType: 'application/json' }
        })
      });
      if (!res.ok) {
        lastErr = 'Modelo ' + model + ' respondeu ' + res.status;
        if (res.status === 401 || res.status === 403) throw new Error('Chave da API inválida ou sem permissão.');
        continue;
      }
      const data = await res.json();
      const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const text = parts.filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
      if (text) return { text, model };
    } catch (e) {
      if (String(e.message).includes('Chave')) throw e;
      lastErr = String(e.message || e);
    }
  }
  throw new Error('Não foi possível obter resposta da IA: ' + (lastErr || 'verifique a chave e a conexão.'));
}

function parseJson(text) {
  try { return JSON.parse(stripFences(text)); }
  catch (e) {
    const s = String(text || '').indexOf('{');
    const en = String(text || '').lastIndexOf('}');
    if (s >= 0 && en > s) { try { return JSON.parse(text.slice(s, en + 1)); } catch (e2) { return null; } }
    return null;
  }
}

function normalizeQuestion(q, idx, fallbackDiscipline, theme) {
  if (!q) return null;
  const statement = String(q.statement || q.enunciado || '').trim();
  if (!statement) return null;

  let options = { A: '', B: '', C: '', D: '', E: '' };
  const rawOpt = q.options || q.alternativas;
  if (rawOpt && typeof rawOpt === 'object' && !Array.isArray(rawOpt)) {
    LETTERS.forEach(l => { options[l] = String(rawOpt[l] || rawOpt[l.toLowerCase()] || '').trim(); });
  } else if (Array.isArray(rawOpt)) {
    rawOpt.slice(0, 5).forEach((t, i) => {
      options[LETTERS[i]] = String(t).replace(/^(\(?[A-E]\)?[\s.):\–—-]+)/i, '').trim();
    });
  }
  if (!options.A || !options.E) return null;

  const letter = normLetter(q.correctOption ?? q.gabarito ?? q.answer) || 'A';

  let foundation = q.foundation && typeof q.foundation === 'object' ? {
    dispositivo: String(q.foundation.dispositivo || '').trim(),
    fonte: String(q.foundation.fonte || '').trim(),
    transcricao: String(q.foundation.transcricao || '').trim(),
    explicacao: String(q.foundation.explicacao || '').trim(),
    dicaMemorizacao: String(q.foundation.dicaMemorizacao || '').trim()
  } : { dispositivo: '', fonte: '', transcricao: '', explicacao: '', dicaMemorizacao: '' };

  if (!foundation.transcricao) {
    const legacy = String(q.directFoundation || q.fundamentacao || '').trim();
    if (legacy) {
      const i = legacy.indexOf(':');
      foundation.dispositivo = (i > 0 && i < 140) ? legacy.slice(0, i).trim() : 'Fundamento da banca';
      foundation.transcricao = (i > 0 && i < 140) ? legacy.slice(i + 1).trim() : legacy;
      foundation.explicacao = String(q.explanation || q.comentario || '').trim();
    }
  }
  if (!foundation.transcricao) foundation.transcricao = 'Gabarito oficial: Letra (' + letter + '). Conforme resolução e normas aplicáveis pela banca examinadora.';
  if (!foundation.dispositivo) foundation.dispositivo = 'Fundamento da banca examinadora';

  const rawDA = q.distractorAnalysis || {};
  const distractorAnalysis = {};
  LETTERS.forEach(l => {
    const note = String(rawDA[l] || rawDA[l.toLowerCase()] || '').trim();
    distractorAnalysis[l] = note || (l === letter
      ? 'CORRETA conforme a legislação e o gabarito oficial do concurso.'
      : 'INCORRETA segundo o gabarito oficial da banca examinadora.');
  });

  return {
    id: uid() + idx,
    orderIndex: idx + 1,
    statement,
    options,
    correctOption: letter,
    discipline: String(q.discipline || fallbackDiscipline || 'FCC Nível Médio'),
    theme: String(q.theme || theme || ''),
    fccTrapType: String(q.fccTrapType || 'Padrão FCC de Nível Médio'),
    foundation,
    directFoundation: composeFoundation(foundation),
    distractorAnalysis
  };
}

function composeFoundation(f) {
  let out = '';
  if (f.dispositivo) out += f.dispositivo;
  if (f.fonte && f.fonte !== f.dispositivo) out += (out ? ' — ' : '') + f.fonte;
  if (f.transcricao) out += (out ? '\n\n' : '') + f.transcricao;
  if (f.explicacao) out += (out ? '\n\n' : '') + f.explicacao;
  return out;
}

function normalizeRayX(r, theme) {
  const obj = r && typeof r === 'object' ? r : {};
  const tp = obj.typicalPattern || {};
  return {
    frequency: ['Alta', 'Média', 'Baixa'].includes(obj.frequency) ? obj.frequency : 'Alta',
    typicalPattern: {
      formatPreference: String(tp.formatPreference || 'Casos Práticos Hipotéticos'),
      targetArticles: Array.isArray(tp.targetArticles) && tp.targetArticles.length ? tp.targetArticles.map(String) : ['Dispositivos centrais de ' + theme],
      styleSummary: String(tp.styleSummary || 'A FCC cobra o tema com enunciados enxutos e distratores que alteram um único termo da redação oficial.')
    },
    trapMapping: (Array.isArray(obj.trapMapping) ? obj.trapMapping : []).map(t => ({
      trapName: String(t && t.trapName || 'Pegadinha recorrente'),
      description: String(t && t.description || ''),
      example: String(t && t.example || '')
    })).filter(t => t.description),
    seniorTip: String(obj.seniorTip || 'Leia as cinco alternativas até o ponto final e compare cada verbo-chave com o dispositivo de regência.')
  };
}

/* =====================================================================
   GERAÇÃO DE QUESTÕES (ETAPAS 1–3)
   ===================================================================== */
async function handleGenerate(e) {
  if (e) e.preventDefault();
  const theme = (document.getElementById('themeInput') || {}).value || '';
  const discipline = (document.getElementById('disciplineInput') || {}).value || 'Geral';
  const exam = (document.getElementById('examInput') || {}).value || 'FCC Nível Médio';
  const count = state.genCount || 3;

  if (!theme.trim()) { state.error = 'Informe o tema desejado para o especialista analisar e gerar as questões.'; render(); return; }

  state.loading = true;
  state.error = null;
  state.loadingStep = 1;
  render();

  const stepTimer = setInterval(() => {
    state.loadingStep = Math.min(3, state.loadingStep + 1);
    const st = document.getElementById('loadSteps');
    if (st) renderLoadSteps(st);
  }, 1200);

  try {
    const res = await callGemini(buildGenPrompt(theme.trim(), discipline, exam, count));
    const obj = parseJson(res.text);
    if (!obj || !obj.questions || !obj.questions.length) throw new Error('A IA não devolveu questões válidas.');

    const questions = obj.questions
      .map((q, i) => normalizeQuestion(q, i, discipline, theme.trim()))
      .filter(Boolean)
      .slice(0, count);

    if (!questions.length) throw new Error('Nenhuma questão com fundamentação completa foi gerada.');

    state.gen = {
      theme: theme.trim(),
      discipline,
      exam,
      model: res.model,
      rayX: normalizeRayX(obj.rayX, theme.trim()),
      questions,
      answers: {},
      explanations: {},
      eliminated: {}
    };
  } catch (err) {
    state.error = String(err.message || err);
  } finally {
    clearInterval(stepTimer);
    state.loading = false;
    render();
  }
}

function renderLoadSteps(el) {
  const steps = [
    'ETAPA 1 — Raio-X: incidência recente & pegadinhas',
    'ETAPA 2 — Questões inéditas com distratores verossímeis',
    'ETAPA 3 — Gabarito comentado & engenharia de distratores'
  ];
  el.innerHTML = steps.map((s, i) => `
    <div class="panel" style="padding:11px 13px;display:flex;gap:11px;align-items:center;font-size:11.5px;font-weight:${state.loadingStep >= i + 1 ? '800' : '600'};color:${state.loadingStep >= i + 1 ? '#1e3a8a' : '#94a3b8'};background:${state.loadingStep >= i + 1 ? '#eff6ff' : '#f8fafc'};border-color:${state.loadingStep >= i + 1 ? '#bfdbfe' : '#e2e8f0'}">
      <div style="width:21px;height:21px;border-radius:99px;background:${state.loadingStep >= i + 1 ? '#2563eb' : '#e2e8f0'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0">${i + 1}</div>
      <span>${s}</span>
    </div>`).join('');
}

function answerGen(qIndex, letter) {
  const g = state.gen;
  if (!g || g.answers[qIndex]) return;
  g.answers[qIndex] = letter;
  g.explanations[qIndex] = true;
  const q = g.questions[qIndex];
  if (letter === q.correctOption) confettiBurst();
  render();
}
function toggleGenExpl(qIndex) {
  const g = state.gen;
  g.explanations[qIndex] = !g.explanations[qIndex];
  render();
}
function toggleGenElim(qIndex, letter) {
  const g = state.gen;
  const k = qIndex + '-' + letter;
  g.eliminated[k] = !g.eliminated[k];
  render();
}

function confettiBurst() {
  try {
    const colors = ['#059669', '#2563eb', '#e9c659', '#4338ca'];
    for (let i = 0; i < 26; i++) {
      const d = document.createElement('div');
      const size = 6 + Math.random() * 7;
      d.style.cssText = 'position:fixed;z-index:99;width:' + size + 'px;height:' + size + 'px;background:' + colors[i % colors.length] + ';border-radius:2px;pointer-events:none;left:' + (45 + Math.random() * 10) + 'vw;top:45vh;opacity:1;transform:rotate(' + Math.random() * 360 + 'deg)';
      document.body.appendChild(d);
      const angle = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 220;
      d.animate([{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                 { transform: 'translate(' + Math.cos(angle) * dist + 'px,' + (Math.sin(angle) * dist + 220) + 'px) rotate(' + (Math.random() * 600) + 'deg)', opacity: 0 }],
                 { duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.3,1)' }).onfinish = () => d.remove();
    }
  } catch (e) {}
}

    const s = getSession(sim.sessionId);

function getSession(id) { return state.sessions.find(s => s.id === id); }

function copyGenReport() {
  const g = state.gen;
  if (!g) return;
  const ray = g.rayX;
  let t = '========================================================\n';
  t += 'ESPECIALISTA FCC - RELATORIO OFICIAL DE QUESTOES INEDITAS\n';
  t += 'TEMA: ' + g.theme + '\n';
  t += 'DISCIPLINA: ' + g.discipline + ' | ORGAO ALVO: ' + g.exam + '\n';
  t += '========================================================\n\n';
  t += '--- ETAPA 1: RAIO-X FCC ---\n';
  t += 'Incidencia: ' + ray.frequency + '\n';
  t += 'Formato: ' + ray.typicalPattern.formatPreference + '\n';
  t += 'Padrao: ' + ray.typicalPattern.styleSummary + '\n';
  t += 'Artigos/Regras:\n' + ray.typicalPattern.targetArticles.map(a => '- ' + a).join('\n') + '\n\n';
  t += 'Pegadinhas:\n' + ray.trapMapping.map(x => '- ' + x.trapName + ': ' + x.description + (x.example ? ' (Ex: "' + x.example + '")' : '')).join('\n') + '\n\n';
  t += 'Dica de ouro: ' + ray.seniorTip + '\n\n';
  t += '--- ETAPA 2: QUESTOES INEDITAS ---\n\n';
  g.questions.forEach((q, i) => {
    t += 'QUESTAO ' + (i + 1) + ' (' + q.discipline + ')\n' + q.statement + '\n\n';
    LETTERS.forEach(l => { t += '(' + l + ') ' + q.options[l] + '\n'; });
    t += '\n--- ETAPA 3: GABARITO COMENTADO ---\n';
    t += 'Gabarito oficial: Letra (' + q.correctOption + ')\n';
    t += 'Fundamento:\n' + (q.directFoundation || '') + '\n\n';
    t += 'Engenharia de distratores:\n';
    LETTERS.forEach(l => { t += '(' + l + ') ' + (q.distractorAnalysis[l] || '') + '\n'; });
    t += '--------------------------------------------------------\n\n';
  });

  const done = () => toast('Relatorio copiado para a area de transferencia 📋');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else {
    fallbackCopy(t, done);
  }
}
function fallbackCopy(text, cb) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    if (cb) cb();
  } catch (e) { toast('Nao foi possivel copiar automaticamente.'); }
}

function saveGenAsSession() {
  const g = state.gen;
  if (!g) return;
  const session = {
    id: uid(),
    title: g.theme,
    discipline: g.discipline,
    targetExam: g.exam,
    source: 'ia',
    model: g.model,
    createdAt: new Date().toISOString(),
    questions: g.questions.map(q => ({ ...q })),
    answers: []
  };
  state.sessions.unshift(session);
  saveSessions();
  startSimulado(session.id);
  toast('Caderno salvo! Bom estudo 🎯');
}

function startSimulado(sessionId) {
  const s = getSession(sessionId);
  if (!s) return;
  // Recupera progresso salvo
  const saved = LS.get('fcc_sim_' + sessionId, null);
  state.sim = {
    sessionId,
    currentIdx: saved ? (saved.currentIdx || 0) : 0,
    elapsed: saved ? (saved.elapsed || 0) : 0,
    paused: false,
    finished: sessionStats(s).done,
    flagged: saved ? (saved.flagged || {}) : {}
  };
  state.tab = 'simulado';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  startTimer();
}

function persistSim() {
  if (!state.sim) return;
  LS.set('fcc_sim_' + state.sim.sessionId, {
    currentIdx: state.sim.currentIdx,
    elapsed: state.sim.elapsed,
    flagged: state.sim.flagged
  });
}

let timerHandle = null;
function startTimer() {
  stopTimer();
  timerHandle = setInterval(() => {
    if (!state.sim || state.sim.paused || state.sim.finished) return;
    state.sim.elapsed += 1;
    const el = document.getElementById('timerVal');
    if (el) el.textContent = fmtTime(state.sim.elapsed);
    persistSim();
  }, 1000);
}
function stopTimer() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; }

function answerSim(i, letter) {
  const sim = state.sim;
  if (!sim || sim.finished || sim.paused) return;
  const s = getSession(sim.sessionId);
  const q = s.questions[i];
  if ((s.answers || []).some(a => a.qid === q.id)) return;

  s.answers = s.answers || [];
  s.answers.push({ qid: q.id, letter, isCorrect: letter === q.correctOption, at: new Date().toISOString() });
  saveSessions();
  persistSim();
  if (letter === q.correctOption) confettiBurst();

  const st = sessionStats(s);
  if (st.done) { sim.finished = true; stopTimer(); LS.del('fcc_sim_' + sim.sessionId); }
  render();
}
function toggleSimExpl(i) {
  // Ao já ter respondido, a explicação aparece sempre; mantido por consistência
  render();
}
function pauseSim() { if (state.sim) { state.sim.paused = true; persistSim(); render(); } }
function resumeSim() { if (state.sim) { state.sim.paused = false; render(); } }
function saveExitSim() {
  persistSim();
  stopTimer();
  const id = state.sim.sessionId;
  state.sim = null;
  state.tab = 'history';
  render();
  toast('Progresso salvo. Você pode continuar depois pelo Histórico 💾');
}
function finishSim() {
  const sim = state.sim;
  if (!sim) return;
  sim.finished = true;
  stopTimer();
  LS.del('fcc_sim_' + sim.sessionId);
  render();
}
function gotoSimIdx(i) {
  if (!state.sim) return;
  state.sim.currentIdx = i;
  state.sim.paused = false;
  persistSim();
  render();
}
function toggleFlagSim(i) {
  if (!state.sim) return;
  state.sim.flagged[i] = !state.sim.flagged[i];
  persistSim();
  render();
}
function restartBattery(sessionId, alsoStart) {
  const s = getSession(sessionId);
  if (!s) return;
  s.answers = [];
  saveSessions();
  LS.del('fcc_sim_' + sessionId);
  if (alsoStart !== false) { startSimulado(sessionId); toast('Bateria reiniciada! Responda novamente as questões 🔄'); }
  else { render(); toast('Bateria reiniciada. Respostas anteriores zeradas 🔄'); }
}

async function handlePdfFile(file) {
  if (!file) return;
  state.error = null;
  if (!/\.pdf$/i.test(file.name)) { state.error = 'Formato inválido. Envie apenas arquivos PDF.'; render(); return; }
  if (file.size > 20 * 1024 * 1024) { state.error = 'Arquivo muito grande. O limite é de 20 MB.'; render(); return; }

  state.importing = true;
  state.importMsg = 'Extraindo texto do PDF...';
  render();

  try {
    let text = '';
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const parts = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        state.importMsg = 'Lendo página ' + p + ' de ' + pdf.numPages + '...';
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        parts.push(content.items.map(it => it.str).join(' '));
      }
      text = parts.join('\n').trim();
    }

    if (text.length < 120) {
      throw new Error('Não foi possível extrair texto deste PDF (parece ser imagem/escaneado). Use a opção de colar o texto abaixo.');
    }

    await parseTextAndStart(text, file.name.replace(/\.pdf$/i, ''));
  } catch (err) {
    state.importing = false;
    state.error = String(err.message || err);
    render();
  }
}

async function handlePastedText() {
  const text = ((document.getElementById('pastedText') || {}).value || '').trim();
  if (text.length < 120) { state.error = 'Cole um texto maior (com as questões e alternativas).'; render(); return; }
  state.importing = true;
  state.importMsg = 'Analisando o texto com a IA...';
  render();
  try {
    await parseTextAndStart(text, 'Caderno colado');
  } catch (err) {
    state.importing = false;
    state.error = String(err.message || err);
    render();
  }
}

async function parseTextAndStart(text, titleHint) {
  state.importMsg = 'IA identificando questões, alternativas e gabarito...';
  render();

  const CHUNK = 36000;
  const chunks = [];
  let cur = '';
  text.split('\n').forEach(line => {
    if ((cur + '\n' + line).length > CHUNK && cur) { chunks.push(cur); cur = line; }
    else cur = cur ? cur + '\n' + line : line;
  });
  if (cur) chunks.push(cur);

  const collected = [];
  let title = '';
  let start = 1;

  for (let i = 0; i < chunks.length && collected.length < 60; i++) {
    state.importMsg = 'Processando bloco ' + (i + 1) + ' de ' + chunks.length + '...';
    render();
    try {
      const res = await callGemini(buildParsePrompt(chunks[i], start));
      const obj = parseJson(res.text);
      if (obj) {
        if (obj.title && !title) title = String(obj.title);
        (Array.isArray(obj.questions) ? obj.questions : []).forEach((q, j) => {
          const nq = normalizeQuestion(q, collected.length + j, 'Caderno Importado', title);
          if (nq && collected.length < 60) collected.push(nq);
        });
        start += (obj.questions || []).length;
      }
    } catch (e) {
      console.warn('Falha no bloco ' + (i + 1), e);
    }
  }

  if (!collected.length) collected.push(...fallbackParse(text));

  if (!collected.length) {
    throw new Error('Nenhuma questão objetiva com 5 alternativas foi identificada. Verifique o conteúdo do PDF.');
  }

  const session = {
    id: uid(),
    title: title || titleHint || 'Caderno Importado (PDF)',
    discipline: collected[0].discipline || 'Caderno Importado',
    targetExam: 'Caderno Importado (' + titleHint + ')',
    source: 'pdf',
    createdAt: new Date().toISOString(),
    questions: collected.map((q, i) => ({ ...q, orderIndex: i + 1 })),
    answers: []
  };

  state.sessions.unshift(session);
  saveSessions();
  state.importing = false;
  state.error = null;
  startSimulado(session.id);
  toast('Caderno lido! Iniciando simulado 🚀');
}

function fallbackParse(text) {
  const out = [];
  const keyMap = {};
  const gabIdx = text.search(/GABARITO\s*OFICIAL/i);
  const body = gabIdx > 0 ? text.slice(0, gabIdx) : text;
  const keySrc = gabIdx > 0 ? text.slice(gabIdx) : text;
  const kRegex = /(\d+)\s*[-.:–—]\s*([A-Ea-e])\b/g;
  let m;
  while ((m = kRegex.exec(keySrc)) !== null) keyMap[parseInt(m[1], 10)] = m[2].toUpperCase();

  const blocks = body.split(/(?=(?:QUEST[ÃA]O\s+\d+))/i);
  blocks.forEach(b => {
    if (out.length >= 60) return;
    const first = b.search(/\([A-E]\)/i);
    if (first <= 0) return;
    const statement = b.slice(0, first).replace(/^QUEST[ÃA]O\s+\d+\s*[-:.]*/i, '').trim();
    const optPart = b.slice(first);
    const opts = {};
    const re = /\(([A-E])\)\s*([\s\S]*?)(?=\([A-E]\)|$)/gi;
    while ((m = re.exec(optPart)) !== null) opts[m[1].toUpperCase()] = m[2].trim();
    if (opts.A && opts.B && opts.C && opts.D && opts.E && statement.length > 10) {
      const n = out.length + 1;
      const correct = keyMap[n] || 'A';
      out.push(normalizeQuestion({
        statement,
        options: opts,
        correctOption: correct,
        discipline: 'Caderno Importado (PDF)',
        foundation: {
          dispositivo: 'Fundamento da banca examinadora',
          transcricao: 'Gabarito oficial do caderno: Letra (' + correct + '). Conforme resolução e normas aplicáveis pela banca.'
        },
        distractorAnalysis: {}
      }, out.length, 'Caderno Importado (PDF)', 'Caderno Importado'));
    }
  });
  return out;
}

  const k = document.getElementById('setKey');
  const m = document.getElementById('setModel');
  if (k) state.settings.apiKey = k.value.trim();
  if (m) state.settings.model = m.value;
  saveSettings();
  closeModal();
  render();
  toast('Configurações salvas ⚙️');
}

function exportData() {
  const blob = new Blob([JSON.stringify({ sessions: state.sessions, settings: state.settings }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'especialista-fcc-dados-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  toast('Dados exportados com sucesso ⬇️');
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (Array.isArray(data.sessions)) state.sessions = data.sessions;
      if (data.settings) state.settings = { ...state.settings, ...data.settings };
      saveSessions();
      saveSettings();
      closeModal();
      render();
      toast('Dados importados com sucesso ⬆️');
    } catch (e) { toast('Arquivo inválido.'); }
  };
  r.readAsText(file);
}

/* =====================================================================
   RENDER PRINCIPAL
   ===================================================================== */
function render() {
  renderNav();
  renderStatus();
  const main = document.getElementById('main');
  let html = '';
  switch (state.tab) {
    case 'generator': html = renderGenerator(); break;
    case 'pdf': html = renderPdf(); break;
    case 'simulado': html = renderSimulado(); break;
    case 'erros': html = renderErros(); break;
    case 'stats': html = renderStats(); break;
    case 'history': html = renderHistory(); break;
    default: html = renderGenerator();
  }
  main.innerHTML = html + `
    <div class="footer" style="margin:28px -12px -120px;border-radius:0">
      <div class="inner">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <strong style="color:#fff">Especialista FCC</strong><span style="color:#c9a227">•</span>
          <span>Nível Médio — TRTs, TREs, TRFs, TJs e Administrativos</span>
        </div>
        <div>Versão HTML permanente • Raio-X • Questões inéditas • Engenharia de distratores</div>
      </div>
    </div>`;

  // Reaplica passo de loading se necessário
  const ls = document.getElementById('loadSteps');
  if (ls && state.loading) renderLoadSteps(ls);

  // Drag & drop
  const dz = document.getElementById('dropZone');
  if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('over');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handlePdfFile(f);
    });
  }
}

/* ---------------- Boot ---------------- */
state.genCount = 3;

// Garante a chave do usuário embutida no arquivo (sem pedir configuração inicial)
if (!state.settings.apiKey) {
  state.settings.apiKey = DEFAULT_API_KEY;
  saveSettings();
}

applyFont();
render();

// Verifica se há simulado pausado pendente
const pending = state.sessions.find(s => {
  const st = sessionStats(s);
  return st.answered > 0 && !st.done;
});
if (pending) {
  setTimeout(() => toast('Você tem um caderno em andamento: “' + pending.title.slice(0, 40) + '”. Retome pelo Histórico ⏸️', 4200), 700);
}

/* =====================================================================
   TELA CHEIA / APP WEB (PWA) — instalar e abrir sem barras do navegador
   ===================================================================== */

// Detecta se já está rodando como app em tela cheia (standalone)
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: fullscreen)').matches ||
         window.navigator.standalone === true;
}

// Service worker REAL (/sw.js) — habilita instalação e uso offline.
// O manifest (/manifest.json) e os ícones PNG já estão declarados no <head>.
(function registerAppShell() {
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () { /* sem SW: o app continua funcionando */ });
      });
    }
  } catch (e) { /* ignora quando aberto via file:// */ }
})();

// Captura o evento de instalação (Android/Chrome)
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstall = e;
  if (!isStandalone()) showFsBanner();
});
window.addEventListener('appinstalled', () => { deferredInstall = null; hideFsBanner(); });

// Tenta entrar em tela cheia real (Fullscreen API) — funciona em Android e após gesto do usuário
function requestFs() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (fn) { try { return fn.call(el); } catch (e) {} }
  return null;
}

// Instala como app OU entra em tela cheia
async function enterFullscreen() {
  if (deferredInstall) {
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch (e) {}
    deferredInstall = null;
    hideFsBanner();
    return;
  }
  const p = requestFs();
  if (p && p.then) { p.then(hideFsBanner).catch(() => {}); }
  else if (isIOS()) { openIosInstall(); }
  else { hideFsBanner(); }
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// Banner discreto para ativar tela cheia / instalar
function showFsBanner() {
  if (isStandalone() || document.getElementById('fsBanner')) return;
  if (LS.get('fcc_fs_dismissed', false)) return;
  const ios = isIOS();
  const div = document.createElement('div');
  div.id = 'fsBanner';
  div.className = 'fs-banner';
  div.innerHTML = `
    <div class="fs-inner">
      <div class="fs-txt">
        <strong>${ios ? 'Remover as barras do Safari' : 'Abrir em tela cheia'}</strong>
        <span>${ios ? 'Toque em Compartilhar ↑ e "Adicionar à Tela de Início".' : 'Instale como aplicativo para usar sem as barras do navegador.'}</span>
      </div>
      <div class="fs-actions">
        <button class="fs-x" onclick="dismissFsBanner()" title="Agora não">✕</button>
        <button class="fs-go" onclick="${ios ? 'openIosInstall()' : 'enterFullscreen()'}">${ios ? 'Como fazer' : 'Ativar'}</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}
function hideFsBanner() { const b = document.getElementById('fsBanner'); if (b) b.remove(); }
function dismissFsBanner() { LS.set('fcc_fs_dismissed', true); hideFsBanner(); }

// Instruções de instalação para iOS (Safari não suporta beforeinstallprompt)
function openIosInstall() {
  openModal(`
    <div class="modal-head">
      <div style="display:flex;gap:10px;align-items:center">
        <div style="width:38px;height:38px;border-radius:13px;background:#2563eb;display:flex;align-items:center;justify-content:center">📲</div>
        <div><div style="font-size:15px;font-weight:900">Abrir em tela cheia (iPhone/iPad)</div><div class="small-note" style="color:#94a3b8">Sem as barras do Safari</div></div>
      </div>
      <button class="icon-btn" style="width:32px;height:32px" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-warn" style="margin-bottom:14px">
        <span>ℹ️</span>
        <div>No iPhone/iPad, o Safari <strong>só esconde as barras (voltar, compartilhar, recarregar)</strong> quando o app é aberto pelo <strong>ícone na tela de início</strong>. Siga os passos abaixo — leva 10 segundos:</div>
      </div>
      <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:2.1;color:#334155">
        <li>Toque no botão <strong>Compartilhar</strong> <span style="font-size:17px">􀈂</span> (o quadrado com a seta para cima) na barra inferior do Safari.</li>
        <li>Role e escolha <strong>“Adicionar à Tela de Início”</strong>.</li>
        <li>Toque em <strong>“Adicionar”</strong> no canto superior direito.</li>
        <li>Feche o Safari e abra o app pelo novo ícone <strong>📘 Especialista FCC</strong>.</li>
      </ol>
      <div class="alert alert-ok" style="margin-top:14px"><span>✅</span><div>Pronto! Ao abrir pelo ícone, o app ocupa a <strong>tela inteira</strong>, sem nenhuma barra do navegador.</div></div>
      <div class="alert alert-info" style="margin-top:10px"><span>🤖</span><div>No <strong>Android/Chrome</strong>: menu <strong>⋮ → “Instalar app”</strong> (ou toque em “Ativar” no banner).</div></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="dismissFsBanner();closeModal()">Não mostrar novamente</button>
      <button class="btn btn-dark btn-sm" onclick="closeModal()">Entendi</button>
    </div>`);
}

// Ao abrir em telas pequenas, oferece tela cheia; em standalone já esconde qualquer banner
if (!isStandalone()) {
  if (window.matchMedia('(max-width: 900px)').matches) {
    // No iPhone/iPad, abre o passo a passo automaticamente na 1ª visita (Safari não instala sozinho)
    if (isIOS() && !LS.get('fcc_ios_hint_seen', false) && location.protocol.startsWith('http')) {
      LS.set('fcc_ios_hint_seen', true);
      setTimeout(openIosInstall, 1200);
    } else {
      setTimeout(showFsBanner, 1500);
    }
  }
} else {
  document.documentElement.classList.add('is-standalone');
}
</script>
